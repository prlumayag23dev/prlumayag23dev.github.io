<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hireme">
    <br></br>
    <h1>Contact Me:</h1>
    <p class="subtitle">
        Have a project in mind or looking for a Virtual Assistant? Let's talk.
    </p>
<br></br>
 <form action="https://formspree.io/f/xzepzjbv" method="POST" class="contact-form" target="_blank">

    <div class="form-group">
        <label for="name">Full Name</label>
        <input 
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            required>
    </div>
    <br></br>
    <div class="form-group">
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="user@gmail.com"
            required>
    </div>
    <br></br>
    <div class="form-group full-width">
        <label for="subject">Subject:</label>
        <input 
            type="text"
            id="subject"
            name="subject"
            placeholder="Project">
    </div>
    <br></br>
    <div class="form-group full-width">
        <label for="message">Message</label>
        <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Tell me what do you have in mind..."
            required></textarea>
    </div>
    <br></br>
        <button type="submit" class="submit-btn">
            Send!
        </button>
    </form>
</section>
    <a href="index.html" class="btn1">Back to Home</a>
</body>
</html>
